<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill display-4 text-primary"></i>
                <h4 class="mt-2 fw-bold">Crear cuenta</h4>
                <p class="text-muted">Registro de personal del Tópico UNH</p>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
                        {% for error in field.errors %}
                            <div class="invalid-feedback d-block">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100">Registrarme</button>
            </form>
            <p class="text-center mt-3 mb-0 small">
                ¿Ya tienes cuenta? <a href="{% url 'accounts:login' %}">Inicia sesión</a>
            </p>
        </div>
    </div>
</div>
