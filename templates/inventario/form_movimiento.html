{% extends 'base.html' %}
{% block title %}Registrar movimiento — Tópico UNH{% endblock %}
{% block header %}Registrar movimiento de inventario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body p-4">
                {% if errores %}
                    <div class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-triangle"></i> {{ errores }}
                    </div>
                {% endif %}
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="id_medicamento">Medicamento <span class="text-danger">*</span></label>
                        <select name="medicamento" id="id_medicamento" class="form-select" required>
                            <option value="">Seleccione...</option>
                            {% for med in medicamentos %}
                                <option value="{{ med.pk }}" {% if datos.medicamento == med.pk|stringformat:'s' %}selected{% endif %}>{{ med.nombre }} ({{ med.stock_actual }} {{ med.unidad }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="id_tipo">Tipo <span class="text-danger">*</span></label>
                            <select name="tipo" id="id_tipo" class="form-select" required>
                                {% for value, label in tipos %}
                                    <option value="{{ value }}" {% if datos.tipo == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="id_cantidad">Cantidad <span class="text-danger">*</span></label>
                            <input type="number" name="cantidad" id="id_cantidad" class="form-control" min="1"
                                   value="{{ datos.cantidad }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_motivo">Motivo</label>
                        <input type="text" name="motivo" id="id_motivo" class="form-control" maxlength="200"
                               value="{{ datos.motivo }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                        <a href="{% url 'inventario:movimientos' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
