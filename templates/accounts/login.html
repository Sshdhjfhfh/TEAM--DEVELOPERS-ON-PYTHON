<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-heart-pulse-fill display-4 text-primary"></i>
                <h4 class="mt-2 fw-bold">Tópico UNH</h4>
                <p class="text-muted">Sistema de Gestión</p>
            </div>
            {% if form.non_field_errors %}
                <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Usuario</label>
                    <input type="text" name="username" id="id_username" class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="id_password">Contraseña</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>
            <p class="text-center mt-3 mb-0 small">
                ¿No tienes cuenta? <a href="{% url 'accounts:registro' %}">Regístrate aquí</a>
            </p>
        </div>
    </div>
</div>
